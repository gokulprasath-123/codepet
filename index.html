<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodePet 2.0</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header>
<h1>🐾 CodePet 2.0</h1>
<p>Your GitHub Coding Companion</p>
</header>

<div class="container">

<div class="profile-card">

<h2>GitHub Profile</h2>

<img src="assets/avatar.png" id="avatar">

<h3 id="username">Loading...</h3>

<p>Commits : <span id="commits">0</span></p>

<p>Level : <span id="level">1</span></p>

</div>

<div class="pet-card">

<img src="assets/pet.png" id="pet">

<h2>CodePet</h2>

<div class="xp-bar">

<div class="xp-fill"></div>

</div>

<div class="buttons">

<button>🍖 Feed</button>

<button>🎮 Play</button>

<button>😴 Sleep</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
